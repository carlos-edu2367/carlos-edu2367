      <stop offset="50%" stop-color="#fda4af" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="monolithGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1f3d"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <pattern id="hudGridL" width="36" height="36" patternUnits="userSpaceOnUse">
