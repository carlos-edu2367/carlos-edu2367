      <text x="71" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#9f1239" letter-spacing="0.8">CLEAN ARCH / DDD</text>

      <rect x="152" y="0" width="150" height="26" rx="5" fill="#ffffff" stroke="#fda4af" stroke-width="1.2"/>
      <text x="227" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#9f1239" letter-spacing="0.8">FASTAPI &amp; ASYNC PY</text>

      <rect x="312" y="0" width="156" height="26" rx="5" fill="#ffffff" stroke="#fda4af" stroke-width="1.2"/>
      <text x="390" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#9f1239" letter-spacing="0.8">REACT 19 &amp; ELECTRON</text>

      <rect x="478" y="0" width="154" height="26" rx="5" fill="#ffffff" stroke="#fda4af" stroke-width="1.2"/>
      <text x="555" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#9f1239" letter-spacing="0.8">AGENTES IA &amp; MCP</text>

      <rect x="642" y="0" width="138" height="26" rx="5" fill="#ffffff" stroke="#fda4af" stroke-width="1.2"/>
      <text x="711" y="17" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#9f1239" letter-spacing="0.8">STRIPE &amp; PIX SSE</text>
