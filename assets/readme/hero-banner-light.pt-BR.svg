<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="heroTitleLPt heroDescLPt">
  <title id="heroTitleLPt">Carlos Eduardo da Silva — Engenheiro de Software Full-Stack</title>
  <desc id="heroDescLPt">Engenheiro de Software Full-Stack focado em Backend, SaaS e Sistemas de Agentes de IA em Goiania, Brasil.</desc>
  <defs>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      .ring-orbit-1 { transform-origin: 965px 190px; animation: spinSlow 26s linear infinite; }
      .ring-orbit-2 { transform-origin: 965px 190px; animation: spinReverse 18s linear infinite; }
      .core-pulse { transform-origin: 965px 190px; animation: pulseRing 3.6s ease-in-out infinite; }
    ]]></style>

    <linearGradient id="bgGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbfb"/>
      <stop offset="55%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#ffe4e6"/>
    </linearGradient>

    <radialGradient id="crimsonAuraL" cx="80%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#e11d48" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#fff1f2" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGradL" x1="0%" y1="0%" x2="100%" y2="100%">
