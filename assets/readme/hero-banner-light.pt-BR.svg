    <text x="630" y="150.5" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#be123c" letter-spacing="2">DA SILVA</text>

    <text x="48" y="210" class="sans" font-size="20.5" font-weight="700" fill="#1f0810" letter-spacing="0.1">Engenheiro de Software Full-Stack</text>
    <text x="392" y="210" class="sans" font-size="20.5" font-weight="700" fill="#e11d48" letter-spacing="0.1">· Backend, SaaS &amp; Agentes de IA</text>

