    <text x="1152" y="42" text-anchor="end" class="mono" font-size="11" fill="#9f1239" letter-spacing="1.8" font-weight="600">LOC: GOIÂNIA, BR [UTC-3] · PT-BR / EN B2</text>
    <line x1="48" y1="54" x2="1152" y2="54" stroke="#e11d48" stroke-opacity="0.25" stroke-width="1"/>

    <rect x="48" y="74" width="356" height="30" rx="15" fill="#ffe4e6" stroke="#e11d48" stroke-opacity="0.7" stroke-width="1.2"/>
    <circle cx="68" cy="89" r="4.5" fill="#e11d48">
