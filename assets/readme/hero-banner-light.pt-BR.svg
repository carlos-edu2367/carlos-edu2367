        <polygon points="965,142 1004,190 965,238 926,190" fill="none" stroke="#fff1f2" stroke-width="1.2" opacity="0.8"/>
        <circle cx="965" cy="190" r="8" fill="#ffffff"/>
      </g>
    </g>

    <path d="M 22 36 L 22 20 L 38 20" fill="none" stroke="#e11d48" stroke-width="2"/>
    <path d="M 1178 36 L 1178 20 L 1162 20" fill="none" stroke="#e11d48" stroke-width="2"/>
    <path d="M 22 354 L 22 370 L 38 370" fill="none" stroke="#e11d48" stroke-width="2"/>
    <path d="M 1178 354 L 1178 370 L 1162 370" fill="none" stroke="#e11d48" stroke-width="2"/>
