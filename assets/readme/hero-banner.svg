<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Carlos Eduardo da Silva — Full-Stack Software Engineer</title>
  <desc id="heroDesc">Backend, SaaS and AI Agent Systems Engineer based in Goiania, Brazil.</desc>
  <defs>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes pulseRing {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.06); opacity: 0.95; }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes spinReverse {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes scanSweep {
        0% { transform: translateY(-40px); opacity: 0; }
        15% { opacity: 0.35; }
        85% { opacity: 0.35; }
        100% { transform: translateY(390px); opacity: 0; }
      }
      @keyframes floatUp {
        0% { transform: translateY(0px); opacity: 0; }
        30% { opacity: 0.85; }
        100% { transform: translateY(-75px); opacity: 0; }
      }
      .ring-orbit-1 { transform-origin: 965px 190px; animation: spinSlow 26s linear infinite; }
      .ring-orbit-2 { transform-origin: 965px 190px; animation: spinReverse 18s linear infinite; }
      .core-pulse { transform-origin: 965px 190px; animation: pulseRing 3.6s ease-in-out infinite; }
      .scanline { animation: scanSweep 6.5s linear infinite; }
      .p1 { animation: floatUp 4.8s ease-out infinite; }
      .p2 { animation: floatUp 6.2s ease-out 1.4s infinite; }
      .p3 { animation: floatUp 5.4s ease-out 2.7s infinite; }
      .p4 { animation: floatUp 7.0s ease-out 0.8s infinite; }
    ]]></style>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070305"/>
      <stop offset="52%" stop-color="#0d0508"/>
      <stop offset="100%" stop-color="#19080e"/>
    </linearGradient>

    <radialGradient id="crimsonAura" cx="80%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#b91c1c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0507" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="leftAura" cx="15%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0a0507" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#7f1d1d" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#4c0519" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff1f2"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>

    <linearGradient id="crimsonTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1f3d"/>
      <stop offset="55%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <linearGradient id="monolithGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1f3d"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff1f3d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>

    <pattern id="hudGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#ff1f3d" stroke-width="0.6" stroke-opacity="0.08"/>
    </pattern>

    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="cardClip">
      <rect x="6" y="6" width="1188" height="378" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect x="6" y="6" width="1188" height="378" rx="20" fill="url(#bgGrad)"/>
    <rect x="6" y="6" width="1188" height="378" fill="url(#hudGrid)"/>
    <rect x="6" y="6" width="1188" height="378" fill="url(#crimsonAura)"/>
    <rect x="6" y="6" width="1188" height="378" fill="url(#leftAura)"/>

    <!-- Perspective Cyber Horizon Lines -->
    <g opacity="0.2">
      <line x1="6" y1="322" x2="1194" y2="322" stroke="#ff1f3d" stroke-width="1"/>
      <line x1="6" y1="348" x2="1194" y2="348" stroke="#e11d48" stroke-width="0.7"/>
      <line x1="6" y1="372" x2="1194" y2="372" stroke="#9f1239" stroke-width="0.7"/>
    </g>

    <!-- Animated Scanline -->
    <rect class="scanline" x="6" y="0" width="1188" height="28" fill="url(#scanGrad)"/>

    <!-- Ambient Floating Particles -->
    <circle class="p1" cx="760" cy="290" r="2.2" fill="#ff1f3d"/>
    <circle class="p2" cx="845" cy="315" r="1.8" fill="#fda4af"/>
    <circle class="p3" cx="1085" cy="285" r="2.5" fill="#ff1f3d"/>
    <circle class="p4" cx="910" cy="330" r="1.6" fill="#fb7185"/>

    <!-- Top HUD Telemetry Header -->
    <text x="48" y="42" class="mono" font-size="11" fill="#fda4af" letter-spacing="2.2" opacity="0.85">SYS.PROFILE // OPERATOR_ID: CE-2367</text>
    <text x="1152" y="42" text-anchor="end" class="mono" font-size="11" fill="#fda4af" letter-spacing="1.8" opacity="0.8">LOC: GOIÂNIA, BR [UTC-3] · EN B2 / PT-BR</text>
    <line x1="48" y1="54" x2="1152" y2="54" stroke="#ff1f3d" stroke-opacity="0.22" stroke-width="1"/>

    <!-- Availability Pill -->
    <rect x="48" y="74" width="338" height="30" rx="15" fill="#1f0910" stroke="#ff1f3d" stroke-opacity="0.65" stroke-width="1.2"/>
    <circle cx="68" cy="89" r="4.5" fill="#ff1f3d" filter="url(#glowStrong)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="83" y="93.5" class="mono" font-size="11.5" font-weight="600" fill="#ffe4e6" letter-spacing="1.3">AVAILABLE FOR FREELANCE · REMOTE</text>

    <!-- Main Kinetic Name -->
    <text x="46" y="168" class="sans" font-size="58" font-weight="800" fill="url(#titleGrad)" letter-spacing="-1.2">CARLOS EDUARDO</text>
    <rect x="572" y="132" width="116" height="28" rx="6" fill="#ff1f3d" fill-opacity="0.16" stroke="#ff1f3d" stroke-opacity="0.6" stroke-width="1"/>
    <text x="630" y="150.5" text-anchor="middle" class="mono" font-size="13" font-weight="700" fill="#ff1f3d" letter-spacing="2">DA SILVA</text>

    <!-- Positioning Subtitle -->
    <text x="48" y="210" class="sans" font-size="22" font-weight="700" fill="#fff1f2" letter-spacing="0.2">Full-Stack Software Engineer</text>
    <text x="366" y="210" class="sans" font-size="22" font-weight="700" fill="url(#crimsonTextGrad)" letter-spacing="0.2">· Backend, SaaS &amp; AI Agent Systems</text>

    <!-- Tagline Description -->
    <text x="48" y="248" class="sans" font-size="14.5" fill="#d4b8c0" letter-spacing="0.2">Architecting multi-tenant SaaS platforms, resilient billing engines, offline-first POS,</text>
    <text x="48" y="270" class="sans" font-size="14.5" fill="#d4b8c0" letter-spacing="0.2">and local-first multi-agent desktop workspaces with Clean Architecture &amp; strict typing.</text>

    <!-- Bottom Telemetry Domain Chips -->
    <g transform="translate(48, 302)">
      <rect x="0" y="0" width="142" height="26" rx="5" fill="#16070c" stroke="#9f1239" stroke-width="1"/>
      <text x="71" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#fda4af" letter-spacing="0.8">CLEAN ARCH / DDD</text>

      <rect x="152" y="0" width="150" height="26" rx="5" fill="#16070c" stroke="#9f1239" stroke-width="1"/>
      <text x="227" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#fda4af" letter-spacing="0.8">FASTAPI &amp; ASYNC PY</text>

      <rect x="312" y="0" width="156" height="26" rx="5" fill="#16070c" stroke="#9f1239" stroke-width="1"/>
      <text x="390" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#fda4af" letter-spacing="0.8">REACT 19 &amp; ELECTRON</text>

      <rect x="478" y="0" width="154" height="26" rx="5" fill="#16070c" stroke="#9f1239" stroke-width="1"/>
      <text x="555" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#fda4af" letter-spacing="0.8">AI AGENTS &amp; MCP</text>

      <rect x="642" y="0" width="138" height="26" rx="5" fill="#16070c" stroke="#9f1239" stroke-width="1"/>
      <text x="711" y="17" text-anchor="middle" class="mono" font-size="10.5" fill="#fda4af" letter-spacing="0.8">STRIPE &amp; PIX SSE</text>
    </g>

    <!-- Right-side Crimson Monolith / AI Core Emblem -->
    <g>
      <!-- Outer HUD Ring -->
      <g class="ring-orbit-1">
        <circle cx="965" cy="190" r="112" fill="none" stroke="#ff1f3d" stroke-width="1.2" stroke-dasharray="14 8 4 8" opacity="0.55"/>
        <circle cx="965" cy="78" r="4" fill="#ff1f3d"/>
        <circle cx="965" cy="302" r="3" fill="#fb7185"/>
      </g>

      <!-- Inner Counter-Rotating Ring -->
      <g class="ring-orbit-2">
        <circle cx="965" cy="190" r="84" fill="none" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="42 18" opacity="0.7"/>
        <polygon points="965,98 970,108 960,108" fill="#ff1f3d"/>
      </g>

      <!-- Pulsing Crimson Monolith Diamond -->
      <g class="core-pulse" filter="url(#glowStrong)">
        <polygon points="965,122 1022,190 965,258 908,190" fill="url(#monolithGrad)" stroke="#fda4af" stroke-width="1.5"/>
        <polygon points="965,142 1004,190 965,238 926,190" fill="none" stroke="#fff1f2" stroke-width="1" opacity="0.65"/>
        <line x1="965" y1="122" x2="965" y2="258" stroke="#ffe4e6" stroke-width="0.9" opacity="0.45"/>
        <line x1="908" y1="190" x2="1022" y2="190" stroke="#ffe4e6" stroke-width="0.9" opacity="0.45"/>
        <circle cx="965" cy="190" r="8" fill="#fff1f2"/>
      </g>

      <!-- Live Telemetry Equalizer Bars Beneath Core -->
      <g transform="translate(929, 320)">
        <rect x="0" y="6" width="5" height="12" rx="2" fill="#ff1f3d">
          <animate attributeName="height" values="6;18;8;14;6" dur="1.4s" repeatCount="indefinite"/>
          <animate attributeName="y" values="12;0;10;4;12" dur="1.4s" repeatCount="indefinite"/>
        </rect>
        <rect x="11" y="2" width="5" height="16" rx="2" fill="#fb7185">
          <animate attributeName="height" values="16;6;18;10;16" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="2;12;0;8;2" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="22" y="8" width="5" height="10" rx="2" fill="#ff1f3d">
          <animate attributeName="height" values="8;20;6;15;8" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="y" values="10;-2;12;3;10" dur="1.6s" repeatCount="indefinite"/>
        </rect>
        <rect x="33" y="0" width="5" height="18" rx="2" fill="#ffe4e6">
          <animate attributeName="height" values="18;8;16;6;18" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="0;10;2;12;0" dur="1.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="44" y="5" width="5" height="13" rx="2" fill="#ff1f3d">
          <animate attributeName="height" values="10;18;7;16;10" dur="1.5s" repeatCount="indefinite"/>
          <animate attributeName="y" values="8;0;11;2;8" dur="1.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="55" y="3" width="5" height="15" rx="2" fill="#fb7185">
          <animate attributeName="height" values="14;5;17;9;14" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="4;13;1;9;4" dur="1.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="66" y="7" width="5" height="11" rx="2" fill="#ff1f3d">
          <animate attributeName="height" values="7;16;9;18;7" dur="1.7s" repeatCount="indefinite"/>
          <animate attributeName="y" values="11;2;9;0;11" dur="1.7s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- Tactical Corner Brackets -->
    <path d="M 22 36 L 22 20 L 38 20" fill="none" stroke="#ff1f3d" stroke-width="2"/>
    <path d="M 1178 36 L 1178 20 L 1162 20" fill="none" stroke="#ff1f3d" stroke-width="2"/>
    <path d="M 22 354 L 22 370 L 38 370" fill="none" stroke="#ff1f3d" stroke-width="2"/>
    <path d="M 1178 354 L 1178 370 L 1162 370" fill="none" stroke="#ff1f3d" stroke-width="2"/>
  </g>

  <!-- Outer Glowing Frame -->
  <rect x="6" y="6" width="1188" height="378" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>
</svg>
