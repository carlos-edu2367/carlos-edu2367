  <rect x="6" y="6" width="1188" height="428" rx="18" fill="url(#sheetBg)" stroke="url(#sheetBorder)" stroke-width="1.8"/>

  <rect x="6" y="6" width="1188" height="40" rx="18" fill="#1b0910" opacity="0.75"/>
  <line x1="6" y1="46" x2="1194" y2="46" stroke="#ff1f3d" stroke-opacity="0.28" stroke-width="1"/>
  <circle cx="28" cy="26" r="4.5" fill="#ff1f3d"/>
  <circle cx="44" cy="26" r="4.5" fill="#be123c"/>
  <circle cx="60" cy="26" r="4.5" fill="#4c0519"/>
  <text x="82" y="30" class="mono" font-size="11.5" font-weight="700" fill="#ffe4e6" letter-spacing="2">FICHA_DO_JOGADOR // DOSSIÊ DE ENGENHARIA</text>
  <text x="1170" y="30" text-anchor="end" class="mono" font-size="11" fill="#fda4af" letter-spacing="1.5">BUILD: FOCO EM PRODUÇÃO</text>

