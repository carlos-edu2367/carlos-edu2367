<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="sheetTitlePt sheetDescPt">
  <title id="sheetTitlePt">Ficha de Operador — Carlos Eduardo da Silva</title>
  <desc id="sheetDescPt">Ficha estilo RPG resumindo classe de engenharia, especializacao, focos tecnicos e tracos arquiteturais ativos.</desc>
  <defs>
    <style><![CDATA[
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes hexSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes shimmerMove {
        0% { transform: translateX(-220px); }
        100% { transform: translateX(720px); }
      }
      .hex-ring { transform-origin: 96px 104px; animation: hexSpin 24s linear infinite; }
      .bar-shimmer { animation: shimmerMove 3.8s ease-in-out infinite; }
    ]]></style>

    <linearGradient id="sheetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090406"/>
      <stop offset="55%" stop-color="#11070b"/>
      <stop offset="100%" stop-color="#18090f"/>
    </linearGradient>

    <linearGradient id="panelBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16080e"/>
      <stop offset="100%" stop-color="#0d0508"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9f1239"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#ff1f3d"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff1f2" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheetBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#881337" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0.8"/>
    </linearGradient>

    <clipPath id="bar1Clip"><rect x="478" y="108" width="642" height="10" rx="5"/></clipPath>
    <clipPath id="bar2Clip"><rect x="478" y="166" width="618" height="10" rx="5"/></clipPath>
    <clipPath id="bar3Clip"><rect x="478" y="224" width="630" height="10" rx="5"/></clipPath>
    <clipPath id="bar4Clip"><rect x="478" y="282" width="598" height="10" rx="5"/></clipPath>
    <clipPath id="bar5Clip"><rect x="478" y="340" width="608" height="10" rx="5"/></clipPath>
