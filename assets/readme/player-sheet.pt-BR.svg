    <text x="46" y="288" fill="#e2cbd1">Automação de processos na Arcaika</text>
    <text x="46" y="305" fill="#e2cbd1">Engenharia (Backend, Portal &amp; APK)</text>

    <text x="46" y="333" class="mono" font-size="10.5" fill="#fb7185" letter-spacing="1">IDIOMAS</text>
