    <rect x="134" y="0" width="132" height="28" rx="6" fill="#1e0911" stroke="#be123c" stroke-width="1"/>
    <text x="200" y="18" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#ffe4e6">🛡️ IDEMPOTENTE</text>

    <rect x="276" y="0" width="132" height="28" rx="6" fill="#1e0911" stroke="#be123c" stroke-width="1"/>
    <text x="342" y="18" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#ffe4e6">📴 OFFLINE-FIRST</text>

    <rect x="418" y="0" width="124" height="28" rx="6" fill="#1e0911" stroke="#be123c" stroke-width="1"/>
    <text x="480" y="18" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#ffe4e6">🧠 LOCAL-FIRST</text>

    <rect x="552" y="0" width="110" height="28" rx="6" fill="#1e0911" stroke="#be123c" stroke-width="1"/>
    <text x="607" y="18" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#ffe4e6">📐 DDD ESTRITO</text>
