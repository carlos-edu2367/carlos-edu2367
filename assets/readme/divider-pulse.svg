<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="img" aria-labelledby="divTitle">
  <title id="divTitle">Section Divider</title>
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a0507" stop-opacity="0"/>
      <stop offset="18%" stop-color="#7f1d1d" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#ff1f3d" stop-opacity="1"/>
      <stop offset="82%" stop-color="#7f1d1d" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0a0507" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulseBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1f3d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff1f2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <line x1="40" y1="18" x2="1160" y2="18" stroke="url(#lineGrad)" stroke-width="1.5"/>

  <rect x="-180" y="16.5" width="180" height="3" rx="1.5" fill="url(#pulseBeam)" filter="url(#crimsonGlow)">
    <animate attributeName="x" from="-180" to="1220" dur="4.2s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(600, 18)" filter="url(#crimsonGlow)">
    <polygon points="0,-8 10,0 0,8 -10,0" fill="#0a0507" stroke="#ff1f3d" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.8" fill="#ff1f3d">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="-28" y1="-5" x2="-18" y2="-5" stroke="#e11d48" stroke-width="1.2" opacity="0.8"/>
    <line x1="-28" y1="5" x2="-18" y2="5" stroke="#e11d48" stroke-width="1.2" opacity="0.8"/>
    <line x1="18" y1="-5" x2="28" y2="-5" stroke="#e11d48" stroke-width="1.2" opacity="0.8"/>
    <line x1="18" y1="5" x2="28" y2="5" stroke="#e11d48" stroke-width="1.2" opacity="0.8"/>
  </g>

  <circle cx="220" cy="18" r="2" fill="#e11d48" opacity="0.7"/>
  <circle cx="980" cy="18" r="2" fill="#e11d48" opacity="0.7"/>
</svg>
